[package]
name = "zluda"
version = "0.0.0"
authors = ["Andrzej Janik <vosen@vosen.pl>"]
edition = "2021"

[lib]
name = "nvcuda"
crate-type = ["cdylib", "staticlib"]

[features]
default = ["intel"]
intel = ["flate2", "ptx_backend"]
amd = ["ptx_backend"]
tenstorrent = ["ptx_backend"]
gemmini = []
nvidia = []
tmatmul = ["ptx_backend"]
cutile = ["comgr/cutile", "ptx_backend"]
embed_cudart = []
flate2 = ["dep:flate2"]
ptx_backend = ["dep:ptx", "dep:ptx_parser"]

[dependencies]
comgr = { path = "../comgr" }
ptx_parser = { path = "../ptx_parser", optional = true }
ptx = { path = "../ptx", optional = true }
cuda_types = { path = "../cuda_types" }
cuda_base = { path = "../cuda_base" }
lazy_static = "1.4"
num_enum = "0.4"
lz4-sys = "1.9"
tempfile = "3"
paste = "1.0"
rustc-hash = "1.1"
ze_runtime_sys = { path = "../ext/ze_runtime-sys" }
hip_runtime_sys = { path = "../ext/hip_runtime-sys" }
tt_runtime_sys = { path = "../ext/tt_runtime-sys" }
tt_comgr_sys = { path = "../ext/tt_comgr-sys" }
cutile_comgr_sys = { path = "../ext/cutile_comgr-sys" }
nvidia_runtime_sys = { path = "../ext/nvidia_runtime-sys" }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = { version = "1.0", optional = true }

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["heapapi", "std"] }
